<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>天命盤</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700;900&display=swap">
<style>
:root{
  --ink:#20242e; --ink-2:#4a4f5c; --ink-3:#767c8a;
  --washi:#f4efe3; --surface:#fbf7ee; --surface-2:#f0e9da; --line:#ddd3bf;
  --shu:#c0402c; --shu-soft:#d8654e; --gold:#a67c2e; --gold-soft:#c9a24a;
  --seal:#b03826;
  --k-moku:#3f8f6e; --k-ka:#c0402c; --k-do:#b0803a; --k-kin:#b79433; --k-sui:#37628f;
  --good:#3f8f6e; --warn:#c08a2e; --bad:#b8493a;
  --shadow:0 1px 2px rgba(40,30,15,.06),0 8px 30px rgba(60,45,20,.10);
  --radius:14px;
  --serif:"Shippori Mincho B1",serif; --oldmin:"Zen Old Mincho",serif;
  --sans:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#ece6d7; --ink-2:#b3ab99; --ink-3:#847d6d;
  --washi:#12131a; --surface:#191a22; --surface-2:#20222c; --line:#33343f;
  --shu:#e0674f; --shu-soft:#c8523c; --gold:#c9a24a; --gold-soft:#dcbb63;
  --seal:#d85a44;
  --k-moku:#5cb894; --k-ka:#e0674f; --k-do:#cf9f52; --k-kin:#d6b34a; --k-sui:#5b90c4;
  --good:#5cb894; --warn:#d6a94a; --bad:#e0705c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 40px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ink:#ece6d7; --ink-2:#b3ab99; --ink-3:#847d6d;
  --washi:#12131a; --surface:#191a22; --surface-2:#20222c; --line:#33343f;
  --shu:#e0674f; --shu-soft:#c8523c; --gold:#c9a24a; --gold-soft:#dcbb63;
  --seal:#d85a44;
  --k-moku:#5cb894; --k-ka:#e0674f; --k-do:#cf9f52; --k-kin:#d6b34a; --k-sui:#5b90c4;
  --good:#5cb894; --warn:#d6a94a; --bad:#e0705c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{
  margin:0; font-family:var(--sans); color:var(--ink);
  background:var(--washi);
  background-image:
    radial-gradient(1200px 500px at 82% -8%, color-mix(in srgb,var(--gold) 12%, transparent), transparent 60%),
    radial-gradient(900px 500px at -8% 108%, color-mix(in srgb,var(--shu) 10%, transparent), transparent 60%);
  line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1000px; margin:0 auto; padding:clamp(18px,4vw,40px) clamp(16px,4vw,32px) 80px}
/* ---------- header ---------- */
.masthead{text-align:center; padding:16px 0 8px; position:relative}
.seal{display:inline-flex; align-items:center; justify-content:center; width:60px;height:60px;
  border:2px solid var(--seal); color:var(--seal); border-radius:10px; font-family:var(--oldmin);
  font-weight:900; font-size:30px; line-height:1; transform:rotate(-2deg); margin-bottom:14px;
  box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--seal) 12%, transparent)}
h1.title{font-family:var(--oldmin); font-weight:900; letter-spacing:.22em;
  font-size:clamp(34px,7vw,58px); margin:.1em 0 .1em; text-indent:.22em}
.subtitle{color:var(--ink-2); font-size:14px; letter-spacing:.32em; text-transform:uppercase; margin:0}
.lead{color:var(--ink-2); max-width:60ch; margin:14px auto 0; font-size:15px}
.theme-toggle{position:absolute; top:6px; right:0; background:var(--surface); border:1px solid var(--line);
  color:var(--ink-2); border-radius:999px; padding:7px 12px; font-family:var(--sans); font-size:13px; cursor:pointer}
.theme-toggle:hover{color:var(--ink)}
/* ---------- tabs ---------- */
.mode-tabs{display:flex; gap:6px; justify-content:center; margin:26px auto 8px; background:var(--surface-2);
  padding:5px; border-radius:999px; width:max-content; border:1px solid var(--line)}
.mode-tabs button{border:0; background:transparent; color:var(--ink-2); font-family:var(--sans);
  font-weight:700; font-size:14.5px; padding:9px 20px; border-radius:999px; cursor:pointer; letter-spacing:.04em}
.mode-tabs button.active{background:var(--shu); color:#fff; box-shadow:0 3px 12px color-mix(in srgb,var(--shu) 40%, transparent)}
/* ---------- form card ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.form-card{padding:clamp(18px,3vw,28px); margin-top:16px}
.person-forms{display:grid; gap:18px}
.person-forms.duo{grid-template-columns:1fr 1fr}
@media (max-width:680px){.person-forms.duo{grid-template-columns:1fr}}
.pform h3{font-family:var(--serif); font-weight:700; font-size:17px; margin:0 0 4px; display:flex; align-items:center; gap:8px}
.pform h3 .dot{width:9px;height:9px;border-radius:50%}
.field{margin-top:12px}
.field label{display:block; font-size:12.5px; letter-spacing:.06em; color:var(--ink-2); font-weight:700; margin-bottom:5px}
.field input,.field select{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
  background:var(--washi); color:var(--ink); font-family:var(--sans); font-size:15px}
.field input:focus,.field select:focus{outline:2px solid color-mix(in srgb,var(--gold) 60%, transparent); outline-offset:1px; border-color:var(--gold)}
.row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.unknown{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:13px; color:var(--ink-2)}
.unknown input{width:auto}
.actions{display:flex; justify-content:center; margin-top:22px}
.btn-cast{font-family:var(--serif); font-weight:700; letter-spacing:.14em; font-size:17px; color:#fff;
  background:linear-gradient(135deg,var(--shu),var(--seal)); border:0; padding:14px 42px; border-radius:999px;
  cursor:pointer; box-shadow:0 6px 20px color-mix(in srgb,var(--shu) 38%, transparent); transition:transform .12s}
.btn-cast:hover{transform:translateY(-2px)} .btn-cast:active{transform:translateY(0)}
.err{color:var(--bad); text-align:center; margin-top:12px; font-size:13.5px; min-height:1em; font-weight:700}
/* ---------- results ---------- */
#result{margin-top:30px; display:none} #result.show{display:block; animation:rise .5s ease}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.section{margin-top:26px}
.section-head{display:flex; align-items:baseline; gap:12px; margin-bottom:14px}
.section-head .kanji{font-family:var(--oldmin); font-weight:900; font-size:22px; letter-spacing:.1em; color:var(--ink)}
.section-head .en{font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-weight:700}
.section-head .rule{flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent)}
.name-banner{text-align:center; padding:6px 0 2px}
.name-banner .nm{font-family:var(--serif); font-size:clamp(22px,5vw,30px); font-weight:700}
.name-banner .meta{color:var(--ink-2); font-size:13.5px; margin-top:2px}
/* pillars grid */
.pillars{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.pillar{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 8px 12px;
  text-align:center; box-shadow:var(--shadow); position:relative; overflow:hidden}
.pillar{cursor:pointer; transition:transform .12s}
.pillar:hover{transform:translateY(-2px)}
.pillar.sel{outline:2px solid var(--gold); outline-offset:1px}
.pillar .plabel{font-size:11px; letter-spacing:.2em; color:var(--ink-3); font-weight:700}
.pillar .substar{font-size:11.5px; color:var(--ink-2); min-height:1.2em; margin-top:6px; font-weight:700}
.glyph{font-family:var(--oldmin); font-weight:900; font-size:clamp(34px,9vw,52px); line-height:1.12; display:block}
.glyph.stem{margin-top:2px} .glyph.branch{margin-top:0}
.pillar .yy{font-size:11px; color:var(--ink-3); letter-spacing:.1em}
.pillar .unsei{font-size:11.5px; color:var(--gold); font-weight:700; margin-top:5px; min-height:1.1em}
.elem-tag{display:inline-block; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; color:#fff; margin-top:3px}
.k-moku{background:var(--k-moku)}.k-ka{background:var(--k-ka)}.k-do{background:var(--k-do)}.k-kin{background:var(--k-kin)}.k-sui{background:var(--k-sui)}
.c-moku{color:var(--k-moku)}.c-ka{color:var(--k-ka)}.c-do{color:var(--k-do)}.c-kin{color:var(--k-kin)}.c-sui{color:var(--k-sui)}
/* two-col info */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media (max-width:680px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 18px; box-shadow:var(--shadow)}
.panel h4{margin:0 0 4px; font-family:var(--serif); font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.badge{font-size:11px; font-weight:700; letter-spacing:.08em; padding:2px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
.panel p{margin:8px 0 0; font-size:14px; color:var(--ink-2)}
/* five element bars */
.elem-bars{display:flex; flex-direction:column; gap:9px; margin-top:4px}
.ebar{display:grid; grid-template-columns:26px 1fr 30px; align-items:center; gap:10px}
.ebar .lb{font-family:var(--oldmin); font-weight:900; font-size:16px}
.ebar .track{height:12px; background:var(--surface-2); border-radius:999px; overflow:hidden}
.ebar .fill{height:100%; border-radius:999px; transition:width .8s cubic-bezier(.2,.7,.2,1)}
.ebar .val{font-size:13px; text-align:right; color:var(--ink-2); font-variant-numeric:tabular-nums; font-weight:700}
/* energy gauge */
.gauge-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.gauge{--p:0; width:120px;height:120px;border-radius:50%; flex:none;
  background:conic-gradient(var(--gold) calc(var(--p)*1%), var(--surface-2) 0);
  display:grid; place-items:center; position:relative}
.gauge::before{content:""; position:absolute; inset:11px; border-radius:50%; background:var(--surface)}
.gauge .num{position:relative; text-align:center}
.gauge .num b{font-family:var(--serif); font-size:30px; display:block; line-height:1}
.gauge .num s{font-size:11px; color:var(--ink-3); text-decoration:none; letter-spacing:.1em}
.jusei-list{display:flex; gap:10px; flex-wrap:wrap; margin-top:2px}
.jusei{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:7px 12px; text-align:center; min-width:74px}
.jusei .p{font-size:10.5px; color:var(--ink-3); letter-spacing:.1em}
.jusei .s{font-family:var(--serif); font-weight:700; font-size:15px}
.jusei .pt{font-size:11px; color:var(--gold); font-weight:700}
/* luck cycles */
.luck-block{margin-top:16px}
.lb-title{font-family:var(--serif); font-weight:700; font-size:15.5px}
.lb-title span{font-family:var(--sans); font-weight:400; font-size:12px; color:var(--ink-3); margin-left:8px}
.luck-strip{display:flex; gap:9px; overflow-x:auto; padding:9px 2px 8px; scroll-snap-type:x proximity; scrollbar-width:thin}
.luck-card{flex:0 0 auto; width:98px; background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:11px 7px; text-align:center; box-shadow:var(--shadow); scroll-snap-align:start}
.luck-card.sm{width:84px}
.luck-card.cur{border-color:var(--shu); box-shadow:0 0 0 2px color-mix(in srgb,var(--shu) 34%,transparent), var(--shadow)}
.lc-age{font-size:11.5px; color:var(--ink-2); font-weight:700; font-variant-numeric:tabular-nums}
.lc-age span{color:var(--ink-3); font-weight:400; font-size:10px}
.lc-gz{font-family:var(--oldmin); font-weight:900; font-size:27px; line-height:1.05; margin:6px 0 4px; display:flex; justify-content:center; gap:2px}
.luck-card.sm .lc-gz{font-size:22px}
.lc-star{font-family:var(--serif); font-size:13px; font-weight:700}
.lc-un{font-size:11px; color:var(--ink-2); margin-top:1px}
.lc-tone{font-size:11px; font-weight:700; margin-top:7px; padding:2px 0; border-radius:6px}
.lc-dot{width:8px; height:8px; border-radius:50%; margin:7px auto 0}
.t-good{color:var(--good)} .t-care{color:var(--bad)} .t-flat{color:var(--ink-3)}
.lc-tone.t-good{background:color-mix(in srgb,var(--good) 14%,transparent)}
.lc-tone.t-care{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.lc-tone.t-flat{background:var(--surface-2)}
.lc-dot.t-good{background:var(--good)} .lc-dot.t-care{background:var(--bad)} .lc-dot.t-flat{background:var(--ink-3)}
.luck-card{cursor:pointer; transition:transform .12s}
.luck-card:hover{transform:translateY(-2px)}
.luck-card.sel{outline:2px solid var(--gold); outline-offset:1px}
.luck-hint{font-size:11.5px; color:var(--ink-3); margin-top:2px}
#luckDetail,#luckDetail2{display:none; margin-top:10px}
#luckDetail.show,#luckDetail2.show{display:block; animation:rise .3s ease}
.rk-phase{font-family:var(--serif); font-weight:700; font-size:16px; margin:5px 0 1px}
.t-warn{color:var(--warn)} .t-bad{color:var(--bad)}
.lc-dot.t-warn{background:var(--warn)} .lc-dot.t-bad{background:var(--bad)}
#rokuseiDetail{display:none; margin-top:10px}
#rokuseiDetail.show{display:block; animation:rise .3s ease}
/* body star chart */
.jt-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; max-width:660px; margin:0 auto}
.jt-cell{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:12px 9px; text-align:center;
  box-shadow:var(--shadow); min-height:120px; display:flex; flex-direction:column; justify-content:center; gap:2px}
.jt-cell.blank{background:transparent; border:none; box-shadow:none; min-height:0}
.jt-cell.center{border-color:var(--shu); box-shadow:0 0 0 2px color-mix(in srgb,var(--shu) 26%,transparent), var(--shadow)}
.jt-cell.ju{background:var(--surface-2)}
.jt-pos{font-size:10.5px; letter-spacing:.12em; color:var(--ink-3); font-weight:700}
.jt-sub{font-size:10px; color:var(--gold); font-weight:700}
.jt-star{font-family:var(--serif); font-weight:700; font-size:19px; margin:2px 0 1px}
.jt-cell.main .jt-star{color:var(--ink)}
.jt-cell.center .jt-star{color:var(--shu)}
.jt-cell.ju .jt-star{color:var(--k-sui)}
.jt-mean{font-size:11px; color:var(--ink-2); line-height:1.42}
.jt-cell.main,.jt-cell.ju{cursor:pointer; transition:transform .12s}
.jt-cell.main:hover,.jt-cell.ju:hover{transform:translateY(-2px)}
.jt-cell.sel{outline:2px solid var(--gold); outline-offset:1px}
#pillarDetail,#jintaiDetail{display:none; margin-top:12px}
#pillarDetail.show,#jintaiDetail.show{display:block; animation:rise .3s ease}
.detail-panel p{font-size:14px; color:var(--ink-2); margin:0}
.dt-tag{display:inline-block; font-size:11px; font-weight:700; color:var(--gold); background:var(--surface-2);
  border:1px solid var(--line); border-radius:6px; padding:1px 8px; margin-right:8px; vertical-align:2px}
@media(max-width:520px){.jt-star{font-size:16px}.jt-cell{min-height:106px;padding:10px 5px}.jt-mean{font-size:9.5px}.jt-pos{font-size:9.5px}}
/* compatibility */
.rel-tabs{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:6px}
.rel-tabs button{border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font-family:var(--sans);
  font-weight:700; font-size:14px; padding:8px 18px; border-radius:999px; cursor:pointer}
.rel-tabs button.active{background:var(--gold); border-color:var(--gold); color:#1a1408}
.compat-hero{text-align:center; padding:6px 0 2px}
.compat-hero .pair{font-family:var(--serif); font-size:20px; font-weight:700}
.big-score{--p:0; width:172px;height:172px;border-radius:50%; margin:14px auto 4px;
  background:conic-gradient(from -90deg, var(--shu) calc(var(--p)*1%), var(--surface-2) 0);
  display:grid; place-items:center; position:relative}
.big-score::before{content:""; position:absolute; inset:14px; border-radius:50%; background:var(--surface)}
.big-score .in{position:relative; text-align:center}
.big-score .in b{font-family:var(--serif); font-size:50px; line-height:1; display:block}
.big-score .in s{font-size:12px; letter-spacing:.2em; color:var(--ink-3); text-decoration:none}
.verdict{font-family:var(--serif); font-size:18px; font-weight:700; text-align:center; margin:6px 0 0}
.subscores{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px}
@media (max-width:560px){.subscores{grid-template-columns:1fr}}
.ss{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; box-shadow:var(--shadow)}
.ss .t{font-size:12px; color:var(--ink-2); font-weight:700; letter-spacing:.06em}
.ss .v{font-family:var(--serif); font-size:26px; font-weight:700; margin-top:2px}
.ss .track{height:7px; background:var(--surface-2); border-radius:999px; margin-top:8px; overflow:hidden}
.ss .fill{height:100%; border-radius:999px; background:var(--gold)}
.reasons{margin-top:16px; display:flex; flex-direction:column; gap:9px}
.reason{display:flex; gap:11px; align-items:flex-start; background:var(--surface); border:1px solid var(--line);
  border-radius:11px; padding:12px 14px; font-size:14px}
.reason .ic{font-family:var(--oldmin); font-weight:900; width:26px; height:26px; border-radius:8px; flex:none;
  display:grid; place-items:center; color:#fff; font-size:14px}
.reason.pos .ic{background:var(--good)} .reason.neg .ic{background:var(--bad)} .reason.neu .ic{background:var(--ink-3)}
.reason .tx b{font-weight:700}
.mini-mei{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px}
@media (max-width:560px){.mini-mei{grid-template-columns:1fr}}
.mm{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:var(--shadow)}
.mm .who{font-family:var(--serif); font-weight:700; font-size:15px; margin-bottom:8px}
.mm .mpills{display:flex; gap:6px}
.mm .mp{flex:1; text-align:center; background:var(--surface-2); border-radius:8px; padding:6px 2px}
.mm .mp .l{font-size:9.5px; color:var(--ink-3); letter-spacing:.1em}
.mm .mp .g{font-family:var(--oldmin); font-weight:900; font-size:19px; line-height:1.15}
/* name reading */
.sm-io{display:flex; gap:22px; flex-wrap:wrap}
.sm-group .gl{font-size:12px; color:var(--ink-2); font-weight:700; letter-spacing:.14em; margin-bottom:7px}
.sm-chars{display:flex; flex-wrap:wrap; gap:8px}
.sm-char{width:54px; text-align:center}
.sm-glyph{font-family:var(--oldmin); font-weight:900; font-size:26px; line-height:1.15}
.sm-char input{width:100%; text-align:center; padding:5px 2px; border:1px solid var(--line); border-radius:8px;
  background:var(--washi); color:var(--ink); font-family:var(--sans); font-size:14px; margin-top:4px; -moz-appearance:textfield}
.sm-char.unk input{border-color:var(--warn); background:color-mix(in srgb,var(--warn) 13%,transparent)}
.sm-cap{font-size:10px; color:var(--ink-3); margin-top:2px}
.sm-note{font-size:12px; color:var(--ink-3); margin:14px 0 4px; line-height:1.6}
.sm-warn{color:var(--ink-3); font-size:13px; margin:8px 0 0}
.sm-sum{font-size:13.5px; color:var(--ink-2); margin:14px 0 0; line-height:1.7}
.kaku-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:9px; margin-top:6px}
@media(max-width:620px){.kaku-grid{grid-template-columns:repeat(2,1fr)}}
.kaku-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center; box-shadow:var(--shadow)}
.kaku-card.main{border-color:var(--shu); box-shadow:0 0 0 2px color-mix(in srgb,var(--shu) 26%,transparent), var(--shadow)}
.kk-label{font-size:11px; letter-spacing:.1em; color:var(--ink-3); font-weight:700}
.kk-num{font-family:var(--serif); font-weight:700; font-size:30px; line-height:1.12; font-variant-numeric:tabular-nums}
.kk-num span{font-size:12px; color:var(--ink-3); margin-left:1px}
.kk-badge{display:inline-block; font-size:11px; font-weight:700; padding:1px 10px; border-radius:999px; margin:3px 0 2px}
.kk-badge.good{background:color-mix(in srgb,var(--good) 16%,transparent); color:var(--good)}

/* ============ 計算 ============ */
function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
 return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function sunLongitude(jd){ // 見かけの太陽黄経(度)
 const D=jd-2451545.0;
 const g=(357.529+0.98560028*D)*Math.PI/180;
 let q=280.459+0.98564736*D;
 let L=q+1.915*Math.sin(g)+0.020*Math.sin(2*g);
 L=((L%360)+360)%360; return L;
}
function tenGod(dm,other){ // dm,other = stem index
 const ed=STEM_EL[dm], eo=STEM_EL[other], sameYY=STEM_YIN[dm]===STEM_YIN[other];
 let base;
 if(eo===ed) base= sameYY?0:1;              // 比肩/劫財
 else if(eo===(ed+1)%5) base= sameYY?2:3;   // 食神/傷官 (我生)
 else if(eo===(ed+2)%5) base= sameYY?4:5;   // 偏財/正財 (我剋)
 else if(eo===(ed+3)%5) base= sameYY?6:7;   // 偏官/正官 (剋我)
 else base= sameYY?8:9;                      // 偏印/印綬 (生我)
 return TENGOD[base];
}
function unseiOf(dm,br){
 const start=CHOSEI[dm]; const fwd=STEM_YIN[dm]===0;
 const k= fwd? ((br-start+12)%12) : ((start-br+12)%12);
 return UNSEI[k];
}
function buildMei(p){
 // p: {name,date(Y,M,D),time{h,mm}|null,lon}
 const {y,m,d}=p.date;
 // 地方時補正した現地時刻
 let h=12,mi=0, hasTime=false;
 if(p.time){hasTime=true; h=p.time.h; mi=p.time.mm;}
 const corr=(p.lon-135)*4; // 分
 let lt=h*60+mi+corr; // 補正後 現地時刻(分)
 // 日柱は暦日ベース
 const J=jdn(y,m,d);
 const dayIdx=((J+49)%60+60)%60;
 const dayStem=dayIdx%10, dayBranch=dayIdx%12;
 // 太陽黄経(UT換算：JST-9h、補正込み)
 const jdMoment = J + (lt/60 - 12)/24 - 9/24;
 const lam=sunLongitude(jdMoment);
 const monthBranch=(2+Math.floor(((lam-315+360)%360)/30))%12;
 // 立春基準の年
 let py=y;
 if(m===1) py=y-1;
 else if(m===2) py = (monthBranch===1)? y-1 : y; // 丑ならまだ立春前
 const yearStem=((py-4)%10+10)%10, yearBranch=((py-4)%12+12)%12;
 // 月干（五虎遁）
 const torigetsuStem=(2+(yearStem%5)*2)%10;
 const monthOrder=(monthBranch-2+12)%12;
 const monthStem=(torigetsuStem+monthOrder)%10;
 // 時柱（五鼠遁）
 let hourStem=null,hourBranch=null;
 if(hasTime){
   const hf=(lt/60+24)%24;
   hourBranch=Math.floor(((hf+1)%24)/2);
   const shishiStem=((dayStem%5)*2)%10;
   hourStem=(shishiStem+hourBranch)%10;
 }
 const pillars=[
   {name:'年柱',stem:yearStem,branch:yearBranch},
   {name:'月柱',stem:monthStem,branch:monthBranch},
   {name:'日柱',stem:dayStem,branch:dayBranch},
 ];
 if(hasTime) pillars.push({name:'時柱',stem:hourStem,branch:hourBranch});
 // 通変星・十二運・従星
 pillars.forEach(pl=>{
   pl.mainStem=BR_MAIN[pl.branch];
   pl.unsei=unseiOf(dayStem,pl.branch);
   pl.jusei=JUSEI[pl.unsei];
   if(pl.name==='日柱'){pl.tengod='日主'; pl.shusei='—';}
   else{pl.tengod=tenGod(dayStem,pl.stem); pl.shusei=SHUSEI[pl.tengod];}
   // 支の通変(蔵干本気)
   pl.brTengod=tenGod(dayStem,pl.mainStem);
   pl.brShusei=SHUSEI[pl.brTengod];
 });
 // 五行カウント（天干＋地支の五行）
 const el=[0,0,0,0,0];
 pillars.forEach(pl=>{el[STEM_EL[pl.stem]]++; el[BR_EL[pl.branch]]++;});
 // 中心星＝月支本気の通変
 const centerTen=tenGod(dayStem,BR_MAIN[monthBranch]);
 const centerStar=SHUSEI[centerTen];
 // エネルギー（年月日支の従星点合計）
 let energy=0; const juseiArr=[];
 pillars.forEach(pl=>{ if(['年柱','月柱','日柱'].includes(pl.name)){energy+=pl.jusei[1]; juseiArr.push({pos:pl.name,star:pl.jusei[0],pt:pl.jusei[1]});} });
 return {name:p.name, pillars, dayStem, dayBranch, monthBranch, yearBranch, el, centerStar, centerTen, energy, juseiArr, hasTime, corr, py, lam,
   yearStem, monthStem, jdMoment, birthYear:y, bm:m, bd:d, sex:p.sex, sei:p.sei, mei:p.mei};
}

function gzIndex(s,b){for(let k=0;k<6;k++){const c=s+10*k; if(c%12===b)return c;} return 0;}
function monthBranchAt(jd){const lam=sunLongitude(jd);return (2+Math.floor(((lam-315+360)%360)/30))%12;}
function boundaryDays(jd0,dir){ // 出生から節入りまでの日数（dir:+1順行=次の節 / -1逆行=前の節）
 const b0=monthBranchAt(jd0); const step=dir*0.5; let t=jd0,g=0;
 while(monthBranchAt(t)===b0 && g<400){t+=step; g++;}
 let a=t-step, bb=t; const bA=monthBranchAt(a);
 for(let i=0;i<44;i++){const mid=(a+bb)/2; if(monthBranchAt(mid)===bA)a=mid; else bb=mid;}
 return Math.abs((a+bb)/2 - jd0);
}
function toneOf(tg,un){
 const good=['正財','正官','印綬','食神','偏財'], care=['傷官','劫財','偏官','偏印'];
 const strong=['長生','冠帯','建禄','帝旺'], weak=['病','死','墓','絶'];
 let s=0; if(good.includes(tg))s++; if(care.includes(tg))s--; if(strong.includes(un))s++; if(weak.includes(un))s--;
 return s>=1?['good','追い風']:s<=-1?['care','試練・調整']:['flat','安定'];
}
function currentAge(M){const n=new Date(); let a=n.getFullYear()-M.birthYear;
 if((n.getMonth()+1)<M.bm || ((n.getMonth()+1)===M.bm && n.getDate()<M.bd)) a--; return a;}
function buildDaiun(M){
 const yin=STEM_YIN[M.yearStem], male=(M.sex==='M');
 const forward=(yin===0&&male)||(yin===1&&!male); const dir=forward?1:-1;
 const days=boundaryDays(M.jdMoment,dir); const startAge=days/3;
 const mIdx=gzIndex(M.monthStem,M.monthBranch); const base=Math.round(startAge);
 const rows=[];
 for(let i=1;i<=8;i++){
   const idx=((mIdx+dir*i)%60+60)%60; const st=idx%10, br=idx%12;
   const tg=tenGod(M.dayStem,st), un=unseiOf(M.dayStem,br);
   const a0=base+(i-1)*10;
   rows.push({st,br,tg,shusei:SHUSEI[tg],un,a0,a1:a0+10,tone:toneOf(tg,un)});
 }
 return {forward,startAge,rows};
}
function buildNenun(M){
 const y0=new Date().getFullYear(); const rows=[];
 for(let i=0;i<9;i++){
   const Y=y0+i; const st=((Y-4)%10+10)%10, br=((Y-4)%12+12)%12;
   const tg=tenGod(M.dayStem,st), un=unseiOf(M.dayStem,br);
   rows.push({Y,age:Y-M.birthYear,st,br,tg,shusei:SHUSEI[tg],un,tone:toneOf(tg,un),cur:i===0});
 }
 return rows;
}

const ROKUGO=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]]; // 支合
const SANGO=[[8,0,4],[11,3,7],[2,6,10],[5,9,1]];       // 三合
const HAI=[[0,7],[1,6],[2,5],[3,4],[8,11],[9,10]];     // 六害
function inPair(list,a,b){return list.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));}
function branchRel(a,b){
 if(a===b) return {t:'比和',s:'同じ支で安らぐ'};
 if(inPair(ROKUGO,a,b)) return {t:'支合',s:'六合で自然と惹かれ合う'};
 if((a+6)%12===b) return {t:'冲',s:'向かい合い刺激し合う（衝突も）'};
 for(const g of SANGO){if(g.includes(a)&&g.includes(b)) return {t:'三合',s:'同じ三合、方向性が響き合う'};}
 if(inPair(HAI,a,b)) return {t:'害',s:'すれ違いに注意'};
 return {t:'—',s:'穏やかな中立'};
}
function elemRel(ea,eb){
 if(ea===eb) return 'hiwa';
 if(eb===(ea+1)%5) return 'aGenB';
 if(ea===(eb+1)%5) return 'bGenA';
 if(eb===(ea+2)%5) return 'aKeB';
 return 'bKeA';
}
function compat(A,B,type){
 const reasons=[]; let raw=50;
 const eda=STEM_EL[A.dayStem], edb=STEM_EL[B.dayStem];
 const er=elemRel(eda,edb);
 const nA=NISSHU[STEM[A.dayStem]][0], nB=NISSHU[STEM[B.dayStem]][0];
 // 日主 五行関係
 let dmTxt='', dmPts=0, dmKind='neu';
 if(er==='hiwa'){dmTxt=`日主がどちらも${EL[eda]}性。似た価値観で安心できる相手`; dmPts=(type==='friend'?12:type==='work'?6:8); dmKind='pos';}
 else if(er==='aGenB'){dmTxt=`あなたの${EL[eda]}が相手の${EL[edb]}を育てる「相生」。あなたが支え手に`; dmPts=(type==='work'?13:11); dmKind='pos';}
 else if(er==='bGenA'){dmTxt=`相手の${EL[edb]}があなたの${EL[eda]}を育てる「相生」。あなたが支えられる関係`; dmPts=(type==='love'?12:11); dmKind='pos';}
 else if(er==='aKeB'){dmTxt=`あなたの${EL[eda]}が相手の${EL[edb]}を抑える「相剋」。主導権を握りやすいが配慮を`; dmPts=(type==='work'?7:-6); dmKind=(type==='work'?'pos':'neg');}
 else {dmTxt=`相手の${EL[edb]}があなたの${EL[eda]}を抑える「相剋」。刺激的だが我慢はためこまないで`; dmPts=(type==='work'?6:-6); dmKind=(type==='work'?'pos':'neg');}
 raw+=dmPts; reasons.push({k:dmKind,t:`<b>日主 ${STEM[A.dayStem]}(${nA}) × ${STEM[B.dayStem]}(${nB})</b>：${dmTxt}`});
 // 日支関係（最重要）
 const rd=branchRel(A.dayBranch,B.dayBranch);
 let dbPts=0,dbKind='neu';
 if(rd.t==='支合'){dbPts=(type==='love'?20:14);dbKind='pos';}
 else if(rd.t==='三合'){dbPts=(type==='love'?16:14);dbKind='pos';}
 else if(rd.t==='比和'){dbPts=(type==='friend'?12:8);dbKind='pos';}
 else if(rd.t==='冲'){dbPts=(type==='work'?-6:-15);dbKind=(type==='work'?'neu':'neg');}
 else if(rd.t==='害'){dbPts=-8;dbKind='neg';}
 raw+=dbPts; reasons.push({k:dbKind,t:`<b>日支 ${BR[A.dayBranch]} × ${BR[B.dayBranch]}（${rd.t}）</b>：${rd.s}`});
 // 月支関係
 const rm=branchRel(A.monthBranch,B.monthBranch);
 let mbPts=0,mbKind='neu';
 if(['支合','三合'].includes(rm.t)){mbPts=8;mbKind='pos';}
 else if(rm.t==='比和'){mbPts=5;mbKind='pos';}
 else if(rm.t==='冲'){mbPts=-6;mbKind='neg';}
 else if(rm.t==='害'){mbPts=-4;mbKind='neg';}
 raw+=mbPts;
 if(rm.t!=='—') reasons.push({k:mbKind,t:`<b>月支 ${BR[A.monthBranch]} × ${BR[B.monthBranch]}（${rm.t}）</b>：${rm.s}（価値観・生活リズム）`});
 // 五行補完
 const comb=A.el.map((v,i)=>v+B.el[i]);
 const total=comb.reduce((a,b)=>a+b,0), ideal=total/5;
 const varc=comb.reduce((s,v)=>s+Math.abs(v-ideal),0)/total;
 const compPts=Math.round((1-Math.min(varc,0.8)/0.8)*14);
 raw+=compPts;
 const lack=[...A.el.keys()].filter(i=>A.el[i]<=1 && B.el[i]>=2);
 if(lack.length){reasons.push({k:'pos',t:`<b>五行の補完</b>：あなたに薄い${lack.map(i=>EL[i]).join('・')}の気を相手が補ってくれる、支え合いの配合`});}
 else if(compPts>=9){reasons.push({k:'pos',t:`<b>五行のバランス</b>：二人合わせると五行が満遍なく整い、安定した土台に`});}
 else {reasons.push({k:'neu',t:`<b>五行のバランス</b>：偏りは似た傾向。得意分野が重なりやすい二人`});}
 // 陰陽
 const yyA=STEM_YIN[A.dayStem], yyB=STEM_YIN[B.dayStem];
 if(yyA!==yyB){raw+=(type==='love'?5:2);}
 else{raw+=(type==='friend'?3:1);}
 // 重み付き最終
 let score=Math.round(raw);
 score=Math.max(8,Math.min(98,score));
 return {score, reasons, rd, rm, er};
}

function reduce81(n){while(n>81)n-=80; return n<1?1:n;}
function typeClass(t){return (t==='大吉'||t==='吉')?'good':t==='半'?'warn':'bad';}
function gogyoRel(a,b){ if(a===b)return 'wa'; if(b===(a+1)%5)return 'gen'; if(a===(b+1)%5)return 'gen'; return 'koku';}
function sanzaiJudge(gt,gj,gc){
 const r1=gogyoRel(gt,gj), r2=gogyoRel(gj,gc);
 const bad=(r1==='koku'?1:0)+(r2==='koku'?1:0);
 if(bad===0) return {label:'吉',cls:'good',text:'天・人・地の気が相生・比和で流れ、心身が安定しやすい良い配置です。'};
 if(bad===1) return {label:'半（注意）',cls:'warn',text:'一部に相剋があり、努力や環境で吉凶が分かれやすい配置です。'};
 return {label:'凶（要注意）',cls:'bad',text:'相剋が重なり、無理をすると波乱を招きやすい配置。健康と対人に配慮を。'};
}
function seimeiCharCells(chars,part){
 return chars.map(ch=>{const v=(STROKE[ch]!==undefined)?STROKE[ch]:''; const unk=(v==='');
   return `<div class="sm-char ${unk?'unk':''}"><div class="sm-glyph">${escape(ch)}</div>`+
     `<input class="sm-stroke" data-part="${part}" type="number" min="1" max="60" value="${v}" oninput="recomputeSeimei()" aria-label="${escape(ch)}の画数"><div class="sm-cap">画</div></div>`;}).join('');
}
function recomputeSeimei(){
 const box=document.getElementById('seimeiResult'); if(!box) return;
 const S=[...document.querySelectorAll('.sm-stroke[data-part="sei"]')].map(i=>parseInt(i.value)||0);
 const G=[...document.querySelectorAll('.sm-stroke[data-part="mei"]')].map(i=>parseInt(i.value)||0);
 if(!S.length||!G.length||S.some(v=>!v)||G.some(v=>!v)){
   box.innerHTML='<p class="sm-warn">▸ すべての文字に画数を入力すると、五格の鑑定が表示されます。オレンジ枠は辞書にない文字です。</p>'; return; }
 const sumS=S.reduce((a,b)=>a+b,0), sumG=G.reduce((a,b)=>a+b,0);
 const tenkaku=sumS+(S.length===1?1:0);
 const chikaku=sumG+(G.length===1?1:0);
 const jinkaku=S[S.length-1]+G[0];
 const soukaku=sumS+sumG;
 const gaikaku=tenkaku+chikaku-jinkaku;
 const kaku=[['天格',tenkaku,'先祖から受け継ぐ運'],['人格',jinkaku,'性格の中心・中年の運'],['地格',chikaku,'幼少期・才能・家庭'],['外格',gaikaku,'対人・社会からの印象'],['総格',soukaku,'人生全体・晩年の総運']];
 const cards=kaku.map(([lb,num,desc])=>{const f=F81[reduce81(num)]; const cls=typeClass(f[0]);
   return `<div class="kaku-card ${lb==='人格'?'main':''}"><div class="kk-label">${lb}${lb==='人格'?' ★':''}</div>`+
     `<div class="kk-num">${num}<span>画</span></div><div class="kk-badge ${cls}">${f[0]}</div>`+
     `<div class="kk-key">${f[1]}</div><div class="kk-desc">${desc}</div></div>`;}).join('');
 const gt=GOGYO[tenkaku%10],gj=GOGYO[jinkaku%10],gc=GOGYO[chikaku%10];
 const sj=sanzaiJudge(gt,gj,gc);
 const jf=F81[reduce81(jinkaku)];
 box.innerHTML=`<div class="kaku-grid">${cards}</div>`+
   `<div class="sanzai">三才配置 <b class="c-${EL_CLASS[gt]}">${EL[gt]}</b>・<b class="c-${EL_CLASS[gj]}">${EL[gj]}</b>・<b class="c-${EL_CLASS[gc]}">${EL[gc]}</b>（天・人・地）— <span class="${sj.cls}">${sj.label}</span>　${sj.text}</div>`+
   `<p class="sm-sum">もっとも重視される<b>人格${jinkaku}画は「${jf[0]}・${jf[1]}」</b>。総格${soukaku}画（${F81[reduce81(soukaku)][1]}）と三才配置とあわせて、その人の中心的な傾向を映します。</p>`;
}

function miniMei(M){
 return `<div class="mm"><div class="who">${M.name?escape(M.name):'—'}</div>
   <div class="mpills">${M.pillars.map(pl=>`<div class="mp"><div class="l">${pl.name}</div><div class="g c-${EL_CLASS[STEM_EL[pl.stem]]}">${STEM[pl.stem]}</div><div class="g c-${EL_CLASS[BR_EL[pl.branch]]}">${BR[pl.branch]}</div></div>`).join('')}</div>
   <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">日主 <b>${STEM[M.dayStem]}（${NISSHU[STEM[M.dayStem]][0]}）</b>・中心星 <b>${M.centerStar}</b></p></div>`;
}
function duoHTML(A,B){
 const types=[['love','恋愛・パートナー'],['work','仕事・ビジネス'],['friend','友情・仲間']];
 const c=compat(A,B,relType);
 const verd = c.score>=80?'響き合う、得がたい縁':c.score>=65?'相性良好、育てる価値のある関係':c.score>=50?'違いを活かせば伸びる関係':c.score>=35?'努力と歩み寄りが鍵の関係':'刺激は強め、距離感が大切な関係';
 // subscore（3タイプ横断）
 const subs=types.map(([k,l])=>[l,compat(A,B,k).score]);
 return `
 <div class="section">
   <div class="mini-mei">${miniMei(A)}${miniMei(B)}</div>
 </div>
 <div class="section">
   <div class="section-head"><span class="kanji">相性</span><span class="en">Compatibility</span><span class="rule"></span></div>
   <div class="rel-tabs">${types.map(([k,l])=>`<button data-rel="${k}" class="${k===relType?'active':''}">${l}</button>`).join('')}</div>
   <div class="card" style="padding:22px 20px 24px;margin-top:10px">
     <div class="compat-hero">
       <div class="pair">${A.name?escape(A.name):'あなた'} <span style="color:var(--gold)">×</span> ${B.name?escape(B.name):'お相手'}</div>
       <div class="big-score" style="--p:${c.score}"><div class="in"><b>${c.score}</b><s>SCORE</s></div></div>
       <div class="verdict">${verd}</div>
     </div>
     <div class="reasons">${c.reasons.map(r=>`<div class="reason ${r.k==='pos'?'pos':r.k==='neg'?'neg':'neu'}"><div class="ic">${r.k==='pos'?'吉':r.k==='neg'?'凶':'和'}</div><div class="tx">${r.t}</div></div>`).join('')}</div>
     <div class="subscores">${subs.map(([l,v])=>`<div class="ss"><div class="t">${l}</div><div class="v">${v}</div><div class="track"><div class="fill" style="width:${v}%"></div></div></div>`).join('')}</div>
   </div>
 </div>
 <div class="note">相性は日主の五行関係・日支/月支の干支関係・五行の補完から算出しています。数値は縁の傾向を映す目安であり、関係を育てるのはいつもお二人自身です。</div>
 ${shareSectionHTML()}`;
}
function escape(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============ 入力→実行 ============ */
function readPerson(idx){
 const root=$$('.pform')[idx];
 const sei=root.querySelector('.f-sei').value.trim();
 const mei=root.querySelector('.f-mei').value.trim();
 const name=(sei+' '+mei).trim();
 const dateV=root.querySelector('.f-date').value;
 if(!dateV) return {err:'生年月日を入力してください'};
 const [y,m,d]=dateV.split('-').map(Number);
 const notime=root.querySelector('.f-notime').checked;
 const timeV=root.querySelector('.f-time').value;
 let time=null;
 if(!notime && timeV){const [h,mm]=timeV.split(':').map(Number); time={h,mm};}
 const lon=parseFloat(root.querySelector('.f-place').value);
 const sex=root.querySelector('.f-sex').value;
 return {name,sei,mei,date:{y,m,d},time,lon,sex};
}
function run(){
 const err=$('#errMsg'); err.textContent='';
 const a=readPerson(0);
 if(a.err){err.textContent='「あなた」の'+a.err; return;}
 if(mode!=='duo' && !a.sex){err.textContent='「あなた」の性別を選択してください（大運の算出に必要です）'; return;}
 const A=buildMei(a);
 let html;
 if(mode==='duo'){
   const b=readPerson(1);
   if(b.err){err.textContent='「お相手」の'+b.err; return;}
   const B=buildMei(b);
   window._A=A; window._B=B;
   html=soloHead(A)+duoHTML(A,B);
 } else {
   window._shareM=A; window._curM=A;
   html=soloHTML(A);
 }
 window._shareMode=mode;
 const r=$('#result'); r.innerHTML=html; r.classList.add('show');
 bindRelTabs(); setupShare(); recomputeSeimei();
 requestAnimationFrame(()=>{ // ゲージ再描画のトリガ確保
   r.scrollIntoView({behavior:'smooth',block:'start'});
 });
}
function soloHead(A){return '';}
function bindRelTabs(){
 $$('.rel-tabs button').forEach(b=>b.onclick=()=>{
   relType=b.dataset.rel;
   if(window._A&&window._B){
     const r=$('#result'); r.innerHTML=soloHead(window._A)+duoHTML(window._A,window._B);
     bindRelTabs(); setupShare();
   }
 });
}

/* ============ シェア画像（Canvas描画） ============ */
function roundR(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function mkText(x){return (s,cx,cy,font,color,align='center',ls=0)=>{x.font=font;x.fillStyle=color;x.textBaseline='middle';x.textAlign='left';
 s=String(s); let tot=0; for(const ch of s){tot+=x.measureText(ch).width+ls;} tot-=ls;
 let sx=align==='center'?cx-tot/2:align==='right'?cx-tot:cx;
 for(const ch of s){x.fillText(ch,sx,cy);sx+=x.measureText(ch).width+ls;}};}
const CARD={BG:'#14151d',PANEL:'#20222c',LINE:'#3a3b46',INK:'#ece6d7',INK2:'#b0a892',GOLD:'#dcbb63',SHU:'#e0674f',
 EH:['#5cb894','#e0674f','#cf9f52','#d6b34a','#5b90c4']};
async function ensureFonts(){
 try{await Promise.all([
  document.fonts.load('900 92px "Zen Old Mincho"'),
  document.fonts.load('700 46px "Shippori Mincho B1"'),
  document.fonts.load('900 74px "Zen Old Mincho"'),
  document.fonts.load('700 26px "Zen Kaku Gothic New"')]);
  await document.fonts.ready;}catch(e){}
}
function drawSoloCard(M){
 const W=1080,H=1500,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const T=mkText(x);const C=CARD;
 x.fillStyle=C.BG;x.fillRect(0,0,W,H);
 const g=x.createRadialGradient(W*0.82,-120,60,W*0.82,-120,1000);g.addColorStop(0,'rgba(220,187,99,0.13)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle=C.GOLD;x.globalAlpha=.42;x.lineWidth=2;x.strokeRect(30,30,W-60,H-60);x.globalAlpha=1;
 const line=(a,y,b)=>{x.strokeStyle=C.LINE;x.lineWidth=1.5;x.beginPath();x.moveTo(a,y);x.lineTo(b,y);x.stroke();};
 x.strokeStyle=C.SHU;x.lineWidth=3;roundR(x,W/2-33,72,66,66,10);x.stroke();
 T('命',W/2,105,'900 42px "Zen Old Mincho", serif',C.SHU);
 T('天命盤',W/2,205,'900 74px "Zen Old Mincho", serif',C.INK,'center',14);
 T('四柱推命  ×  算命学',W/2,262,'700 24px "Zen Kaku Gothic New", sans-serif',C.GOLD,'center',6);
 line(140,300,940);
 T((M.name||'あなた')+' 様',W/2,352,'700 46px "Shippori Mincho B1", serif',C.INK);
 const ni=NISSHU[STEM[M.dayStem]][0];
 T('日主 '+STEM[M.dayStem]+'（'+ni+'）　／　中心星 '+M.centerStar,W/2,406,'500 26px "Zen Kaku Gothic New", sans-serif',C.INK2);
 const n=M.pillars.length,iL=150,iR=930,step=(iR-iL)/n;
 M.pillars.forEach((pl,i)=>{const cx=iL+step*(i+0.5);
  T(pl.name.replace('柱',''),cx,470,'700 26px "Zen Kaku Gothic New", sans-serif',C.GOLD,'center',6);
  T(STEM[pl.stem],cx,548,'900 90px "Zen Old Mincho", serif',C.EH[STEM_EL[pl.stem]]);
  T(BR[pl.branch],cx,652,'900 90px "Zen Old Mincho", serif',C.EH[BR_EL[pl.branch]]);
  T(pl.name==='日柱'?'日主':pl.shusei,cx,722,'500 22px "Zen Kaku Gothic New", sans-serif',C.INK2);});
 line(140,782,940);
 T('五行バランス',150,824,'700 30px "Shippori Mincho B1", serif',C.INK,'left');
 const mx=Math.max(...M.el,1),by=876,bs=42;
 M.el.forEach((v,i)=>{const yy=by+i*bs;
  T(EL[i],168,yy,'900 30px "Zen Old Mincho", serif',C.EH[i]);
  x.fillStyle=C.PANEL;roundR(x,214,yy-11,612,22,11);x.fill();
  x.fillStyle=C.EH[i];roundR(x,214,yy-11,Math.max(22,612*v/mx),22,11);x.fill();
  T(String(v),858,yy,'700 24px "Zen Kaku Gothic New", sans-serif',C.INK2,'left');});
 line(140,1090,940);
 T('エネルギー '+M.energy+' / 36',150,1134,'700 28px "Zen Kaku Gothic New", sans-serif',C.INK,'left');
 x.fillStyle=C.PANEL;roundR(x,150,1160,780,18,9);x.fill();
 x.fillStyle=C.GOLD;roundR(x,150,1160,Math.max(18,780*M.energy/36),18,9);x.fill();
 if(M.sex==='M'||M.sex==='F'){
  const D=buildDaiun(M),N=buildNenun(M),ca=currentAge(M);const cd=D.rows.find(r=>ca>=r.a0&&ca<r.a1)||D.rows[0];
  T('いまの大運  '+cd.a0+'–'+cd.a1+'歳',150,1236,'700 24px "Zen Kaku Gothic New", sans-serif',C.GOLD,'left');
  T(STEM[cd.st]+BR[cd.br]+'　'+cd.shusei+'／'+cd.un+'（'+cd.tone[1]+'）',150,1274,'500 24px "Zen Kaku Gothic New", sans-serif',C.INK,'left');
  T(N[0].Y+'年の年運  '+N[0].age+'歳',150,1330,'700 24px "Zen Kaku Gothic New", sans-serif',C.GOLD,'left');
  T(STEM[N[0].st]+BR[N[0].br]+'　'+N[0].shusei+'／'+N[0].un+'（'+N[0].tone[1]+'）',150,1368,'500 24px "Zen Kaku Gothic New", sans-serif',C.INK,'left');}
 T('天 命 盤 ・ TENMEIBAN',W/2,H-70,'700 22px "Zen Kaku Gothic New", sans-serif',C.GOLD,'center',6);
 return c.toDataURL('image/png');
}
function drawDuoCard(A,B,type){
 const W=1080,H=1260,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const T=mkText(x);const C=CARD;
 const cp=compat(A,B,type);const tl=type==='love'?'恋愛・パートナー':type==='work'?'仕事・ビジネス':'友情・仲間';
 const subs=[['恋愛',compat(A,B,'love').score],['仕事',compat(A,B,'work').score],['友情',compat(A,B,'friend').score]];
 const verd=cp.score>=80?'響き合う、得がたい縁':cp.score>=65?'相性良好、育てる価値のある関係':cp.score>=50?'違いを活かせば伸びる関係':cp.score>=35?'歩み寄りが鍵の関係':'距離感が大切な関係';
 x.fillStyle=C.BG;x.fillRect(0,0,W,H);
 const g=x.createRadialGradient(W*0.5,H*0.42,80,W*0.5,H*0.42,760);g.addColorStop(0,'rgba(224,103,79,0.13)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle=C.GOLD;x.globalAlpha=.42;x.lineWidth=2;x.strokeRect(30,30,W-60,H-60);x.globalAlpha=1;
 x.strokeStyle=C.SHU;x.lineWidth=3;roundR(x,W/2-33,66,66,66,10);x.stroke();
 T('命',W/2,99,'900 42px "Zen Old Mincho", serif',C.SHU);
 T('天命盤 相性',W/2,192,'900 62px "Zen Old Mincho", serif',C.INK,'center',10);
 T('COMPATIBILITY',W/2,244,'700 20px "Zen Kaku Gothic New", sans-serif',C.GOLD,'center',10);
 x.strokeStyle=C.LINE;x.lineWidth=1.5;x.beginPath();x.moveTo(140,282);x.lineTo(940,282);x.stroke();
 // names with gold ×
 const an=A.name||'あなた',bn=B.name||'お相手';
 x.font='700 44px "Shippori Mincho B1", serif';const wa=x.measureText(an).width,wx=x.measureText('  ×  ').width,wb=x.measureText(bn).width;
 let sx=W/2-(wa+wx+wb)/2;x.textAlign='left';x.textBaseline='middle';
 x.fillStyle=C.INK;x.fillText(an,sx,346);sx+=wa;x.fillStyle=C.GOLD;x.fillText('  ×  ',sx,346);sx+=wx;x.fillStyle=C.INK;x.fillText(bn,sx,346);
 // type pill
 x.font='700 24px "Zen Kaku Gothic New", sans-serif';const pw=x.measureText(tl).width+56;
 x.fillStyle=C.GOLD;roundR(x,W/2-pw/2,392,pw,46,23);x.fill();T(tl,W/2,415,'700 24px "Zen Kaku Gothic New", sans-serif','#1a1408');
 // score ring
 const cx=W/2,cy=610,r=150;
 x.lineWidth=24;x.strokeStyle=C.PANEL;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();
 x.strokeStyle=C.SHU;x.lineCap='round';x.beginPath();x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*cp.score/100);x.stroke();x.lineCap='butt';
 T(cp.score,cx,cy-8,'700 96px "Shippori Mincho B1", serif',C.INK);
 T('SCORE',cx,cy+56,'700 20px "Zen Kaku Gothic New", sans-serif',C.INK2,'center',8);
 T(verd,W/2,820,'700 36px "Shippori Mincho B1", serif',C.INK);
 // subscores
 const scx=[300,540,780];
 subs.forEach((s,i)=>{const X=scx[i];
  T(s[0],X,894,'700 24px "Zen Kaku Gothic New", sans-serif',C.GOLD,'center',4);
  T(s[1],X,942,'700 46px "Shippori Mincho B1", serif',C.INK);
  x.fillStyle=C.PANEL;roundR(x,X-90,978,180,12,6);x.fill();
  x.fillStyle=C.GOLD;roundR(x,X-90,978,Math.max(12,180*s[1]/100),12,6);x.fill();});
 T('日主 '+STEM[A.dayStem]+'（'+NISSHU[STEM[A.dayStem]][0]+'）　×　'+STEM[B.dayStem]+'（'+NISSHU[STEM[B.dayStem]][0]+'）',W/2,1070,'500 26px "Zen Kaku Gothic New", sans-serif',C.INK2);
 T('天 命 盤 ・ TENMEIBAN',W/2,H-66,'700 22px "Zen Kaku Gothic New", sans-serif',C.GOLD,'center',6);
 return c.toDataURL('image/png');
}
function shareSectionHTML(){
 return `<div class="section">
   <div class="section-head"><span class="kanji">保存・シェア</span><span class="en">Save &amp; Share</span><span class="rule"></span></div>
   <div class="panel share-panel">
     <p>診断結果を1枚の画像にまとめて、保存・シェアできます。</p>
     <div class="share-actions"><button class="btn-share" id="genShare">シェア画像を作成</button></div>
     <div id="shareOut" class="share-out"></div>
   </div>
 </div>`;
}
function setupShare(){
 const btn=document.getElementById('genShare'); if(!btn) return;
 btn.onclick=async()=>{
  btn.disabled=true; btn.textContent='作成中…';
  await ensureFonts();
  try{
   const url=(window._shareMode==='duo')?drawDuoCard(window._A,window._B,relType):drawSoloCard(window._shareM);
   const out=document.getElementById('shareOut');
   out.innerHTML=`<img class="share-img" src="${url}" alt="天命盤 診断結果">
     <p class="share-hint">スマホは画像を長押し、PCは右クリックから保存できます</p>
     <div class="share-actions">
       <button class="btn-share ghost" id="copyLink">アプリのリンクをコピー</button>
       ${navigator.share?'<button class="btn-share ghost" id="shareBtn">共有…</button>':''}
     </div>`;
   out.classList.add('show');
   document.getElementById('copyLink').onclick=async e=>{try{await navigator.clipboard.writeText(location.href);e.target.textContent='コピーしました ✓';}catch{e.target.textContent='コピーできませんでした';}};
   const sb=document.getElementById('shareBtn');
   if(sb) sb.onclick=async()=>{try{
     const blob=await (await fetch(url)).blob();
     const file=new File([blob],'tenmeiban.png',{type:'image/png'});
     if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],text:'天命盤で占いました'});
     else await navigator.share({title:'天命盤',text:'天命盤で命式を占いました',url:location.href});
   }catch(err){}};
   btn.style.display='none';
  }catch(err){console.error(err); btn.disabled=false; btn.textContent='もう一度作成'; }
 };
}

/* ============ 初期化 ============ */
function init(){
 const opts=PREF.map(([n,l])=>`<option value="${l}">${n}</option>`).join('');
 $$('.f-place').forEach(s=>s.innerHTML=opts);
 $$('.f-notime').forEach(cb=>cb.addEventListener('change',e=>{
   const t=e.target.closest('.pform').querySelector('.f-time'); t.disabled=e.target.checked; if(e.target.checked)t.value='';
 }));
 $('#tabSolo').onclick=()=>{mode='solo';$('#tabSolo').classList.add('active');$('#tabDuo').classList.remove('active');
   $$('.pform')[1].classList.add('hidden');$('#personForms').classList.remove('duo');$('#castBtn').textContent='命式を立てる';$('#result').classList.remove('show');};
 $('#tabDuo').onclick=()=>{mode='duo';$('#tabDuo').classList.add('active');$('#tabSolo').classList.remove('active');
   $$('.pform')[1].classList.remove('hidden');$('#personForms').classList.add('duo');$('#castBtn').textContent='相性を占う';$('#result').classList.remove('show');};
 $('#castBtn').onclick=run;
 // theme
 const tb=$('#themeBtn');
 tb.onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');
   const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
   document.documentElement.setAttribute('data-theme', dark?'light':'dark');};
}
init();
</script>
